<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B8A9C9">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<title>The Pi Helper</title>
<style>
:root{
  --paper:#FDFBF7; --mint:#A8DADC; --mint-bg1:#D3EFEB; --mint-bg2:#BCE3DA;
  --lav:#B8A9C9; --lav-s:#EEE9F4; --lav-d:#6F58A0; --cream:#FFF8E4;
  --coral:#E76F51; --coral-d:#C4462B; --slate:#2D3142; --muted:#565B70; --ink2:#3F4358;
  --gold:#E9C46A; --breath:#5FB5B8;
  --lcd-bg:#08657B; --lcd-head:#003542; --lcd-hi:#FFBA00;
  --state:var(--lcd-hi); --state-ui:var(--coral-d);
  --tap:52px;
  --px:'Press Start 2P',ui-monospace,Consolas,monospace;
  font-family:'Manrope','Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body{background:linear-gradient(180deg,#CDC2DC,var(--lav));background-attachment:fixed;color:var(--slate);min-height:100dvh;font-size:16px;line-height:1.45}
.app{position:relative;max-width:520px;margin:0 auto;padding:0 10px calc(14px + env(safe-area-inset-bottom))}
.topleds{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.led{display:flex;align-items:center;gap:8px;font-family:var(--px);font-size:7px;opacity:.85}
.led i{width:10px;height:10px;border-radius:50%;background:var(--coral);border:2px solid var(--slate);box-shadow:0 0 6px var(--coral)}
.spk{display:flex;gap:4px}.spk i{width:5px;height:5px;border-radius:50%;background:var(--slate);opacity:.45}
.screen{position:relative;min-height:calc(100dvh - 34px - 14px);padding:14px 16px 30px;border-radius:26px;background:linear-gradient(180deg,var(--mint-bg1),var(--mint-bg2));box-shadow:0 0 0 3px var(--slate),inset 0 0 0 3px rgba(255,255,255,.45),inset 0 10px 24px rgba(45,49,66,.12)}
@media(min-width:760px){.app{margin-top:12px;padding-bottom:10px;border-radius:40px;background:linear-gradient(180deg,#CDC2DC,var(--lav));box-shadow:0 30px 60px rgba(45,49,66,.35),0 0 0 3px var(--slate)}.screen{min-height:min(860px,calc(100dvh - 24px - 34px - 10px))}}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lav-d);outline-offset:2px;border-radius:12px}

/* header */
.top{display:flex;align-items:center;gap:10px;min-height:48px;margin-bottom:10px}
.top h1{flex:1;font-size:24px;font-weight:800;letter-spacing:-.01em}
body[data-view=run] .top{display:none}

/* controls */
.btn{min-height:var(--tap);padding:0 20px;border-radius:999px;border:2px solid var(--slate);background:var(--paper);color:var(--slate);font-weight:800;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 var(--lav),inset 0 2px 0 rgba(255,255,255,.35);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--lav)}
.btn.primary{background:var(--coral-d);color:#fff;box-shadow:0 4px 0 #7E2A18,inset 0 2px 0 rgba(255,255,255,.35)}
.btn.primary:active{box-shadow:0 2px 0 #7E2A18}
.btn.ok{background:var(--mint);box-shadow:0 4px 0 #5E9EA1,inset 0 2px 0 rgba(255,255,255,.35)}
.btn.ok:active{box-shadow:0 2px 0 #5E9EA1}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{color:var(--coral-d);background:var(--paper)}
.btn.wide{width:100%}
.btn.sm{min-height:42px;padding:0 14px;font-size:14px}
.icon{width:46px;height:46px;min-height:46px;border-radius:14px;border:2px solid var(--slate);background:var(--paper);cursor:pointer;font-size:19px;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0;box-shadow:0 3px 0 var(--lav)}
.icon:active{transform:translateY(2px);box-shadow:0 1px 0 var(--lav)}
.icon.sm{width:38px;height:38px;min-height:38px;font-size:15px;border-radius:11px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:2px solid var(--slate);background:var(--paper);cursor:pointer;font-size:14px;font-weight:700;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--slate);color:#fff}
.seg{display:flex;flex-wrap:wrap;padding:4px;border:2px solid var(--slate);border-radius:22px;background:var(--paper);gap:2px}
.seg button{flex:1 1 auto;min-height:40px;border:0;border-radius:999px;background:transparent;cursor:pointer;font-size:14px;font-weight:800;padding:0 10px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--slate);color:#fff}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.mute{color:var(--muted)}
.small{font-size:13px}
.note,.empty{border:2px dashed var(--slate);background:var(--cream);border-radius:16px;padding:12px 14px;margin:8px 0;color:var(--ink2);font-size:14px;line-height:1.5}
.note.warn{border-color:var(--coral-d)}
label.field{display:block;margin:16px 0 6px;font-weight:800;font-size:13px;color:var(--lav-d);letter-spacing:.04em}
.field-hint{font-size:13px;color:var(--muted);font-weight:600;display:block;margin-top:2px}
.text{width:100%;min-height:48px;border-radius:14px;border:2px solid var(--slate);background:var(--paper);padding:0 14px;font-size:16px}
.text::placeholder{color:rgba(86,91,112,.6)}
.cust{display:inline-flex;align-items:center;gap:6px}
.cust input{width:72px;min-height:40px;text-align:center;border-radius:999px;border:2px dashed var(--slate);background:var(--paper);font-size:15px;font-weight:700;padding:0 6px;-moz-appearance:textfield}
.cust input::-webkit-outer-spin-button,.cust input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.cust input::placeholder{color:rgba(86,91,112,.6);font-weight:600}
.cust .u{font-size:13px;font-weight:800;color:var(--ink2)}

/* home */
.seq{background:var(--paper);border:2px solid var(--slate);border-radius:20px;box-shadow:0 4px 0 var(--lav);padding:16px;margin-bottom:14px}
.seq h2{font-size:20px;font-weight:800;margin-bottom:2px}
.seq .meta{color:var(--lav-d);font-weight:800;font-size:13px;margin-bottom:8px}
.seq .tasks-line{color:var(--muted);font-size:14px;margin-bottom:12px}
.empty b{display:block;color:var(--slate);font-size:18px;margin-bottom:4px}

/* editor */
.tasks{list-style:none;margin:14px 0;padding:0;display:flex;flex-direction:column;gap:10px}
.task{background:var(--paper);border:2px solid var(--slate);border-radius:20px;box-shadow:0 4px 0 var(--lav);padding:12px}
.task-main{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center}
.ix{width:30px;height:30px;border-radius:50%;background:var(--mint);border:2px solid var(--slate);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.task-line2{display:flex;gap:10px;align-items:center;margin:10px 0 0 0;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper input{width:64px;min-height:42px;text-align:center;border-radius:12px;border:2px solid var(--slate);background:var(--paper);font-size:17px;font-weight:800}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input{-moz-appearance:textfield}
.type-sel{min-height:42px;border-radius:12px;border:2px solid var(--slate);background:var(--paper);padding:0 10px;font-size:14px;font-weight:700;max-width:100%}
.task-tools{display:flex;gap:6px;margin:10px 0 0 0;align-items:center;flex-wrap:wrap}
details.al{margin:10px 0 0 0}
details.al>summary{cursor:pointer;color:var(--lav-d);font-weight:800;font-size:14px;min-height:36px;display:flex;align-items:center}
.panel{border:2px solid var(--slate);background:var(--paper);border-radius:20px;box-shadow:0 4px 0 var(--lav);padding:4px 16px 16px;margin:14px 0}
.panel h3{font-size:13px;font-weight:800;color:var(--lav-d);letter-spacing:.04em;margin:14px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.snd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.snd button{min-height:44px;border-radius:999px;border:2px solid var(--slate);background:var(--paper);cursor:pointer;font-size:13px;font-weight:800}
.snd button[aria-pressed=true]{background:var(--slate);color:#fff}

/* run */
.run-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.run-top .who{flex:1;min-width:0}
.run-top .who b{display:block;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-top .who span{color:var(--lav-d);font-size:13px;font-weight:800}
.segs{display:flex;gap:4px;margin:4px 0 6px}
.segs i{flex:1;height:12px;border-radius:4px;border:2px solid var(--slate);background:var(--paper)}
.segs i.done{background:var(--breath)}
.segs i.skip{background:var(--lav)}
.segs i.cur{background:var(--state-ui)}
#view-run{--state:var(--lcd-hi);--state-ui:var(--coral-d)}
#view-run[data-st=paused]{--state:#D8CCEA;--state-ui:var(--lav-d)}
#view-run[data-st=over]{--state:#FF9C82;--state-ui:var(--coral-d)}
.ring-wrap{position:relative;width:min(78vw,320px);aspect-ratio:1;margin:16px auto 12px;border-radius:50%;background:var(--lcd-bg);border:5px solid var(--lav);box-shadow:0 0 0 2px var(--slate),inset 0 0 28px rgba(0,0,0,.35)}
.ring-wrap svg{width:100%;height:100%;display:block;overflow:visible;padding:8px}
.ring-bg{fill:none;stroke:rgba(255,255,255,.14);stroke-width:9}
.ring-fg{fill:none;stroke:var(--state);stroke-width:9;stroke-linecap:round;stroke-dasharray:628.32;stroke-dashoffset:0;transform:rotate(-90deg);transform-origin:110px 110px;filter:drop-shadow(0 0 6px var(--state));transition:stroke .3s}
.ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#run-time{font-family:var(--px);font-size:clamp(26px,9vw,38px);color:var(--state);font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 10px rgba(255,186,0,.25)}
#run-state{margin-top:12px;color:#ADD8E0;font-weight:800;font-size:14px}
#run-task{text-align:center;font-size:clamp(22px,6vw,26px);font-weight:800;margin-top:8px;overflow-wrap:anywhere}
#run-type{text-align:center;color:var(--lav-d);font-weight:800;margin-top:2px}
#run-next{text-align:center;color:var(--muted);font-size:14px;margin-top:6px}
.run-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.run-actions .btn{padding:0 8px}
.run-actions .adj{font-size:20px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.run-actions #b-skip{grid-column:1/-1;min-height:44px}
.run-actions .big{grid-column:1/-1;min-height:60px;font-size:19px}
.mic-row{display:flex;align-items:center;gap:12px;margin-top:16px}
.mic-row .heard{flex:1;color:var(--ink2);font-size:14px;min-height:22px}
.mic-row .btn.listening{background:var(--coral-d);color:#fff}
.info h3{font-size:16px;font-weight:800;margin:16px 2px 6px}.info ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}.info li{background:var(--paper);border:2px solid var(--slate);border-radius:14px;padding:9px 12px;font-size:14px;line-height:1.45}.info p{background:var(--cream);border:2px dashed var(--slate);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.5;margin:0}
.checkin,.tipcard{border:2px solid var(--slate);background:var(--paper);border-radius:20px;box-shadow:0 4px 0 var(--lav);padding:14px;margin-top:16px;animation:pop .22s ease-out}
.tipcard{background:var(--cream);border-style:dashed}
.checkin p,.tipcard p{font-size:17px;font-weight:800;margin-bottom:12px}
.ck-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck-btns .btn{min-height:50px;font-size:15px;padding:0 10px}
.ck-listen{display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--ink2);font-size:13px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--coral);border:2px solid var(--slate);animation:pulse 1.1s infinite}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
@keyframes pulse{50%{opacity:.25}}

/* done */
.sum{list-style:none;padding:0;margin:14px 0;display:flex;flex-direction:column;gap:8px}
.sum li{display:flex;gap:10px;align-items:baseline;background:var(--paper);border:2px solid var(--slate);border-radius:16px;padding:10px 14px}
.sum li b{flex:1}
.sum .tag{color:var(--lav-d);font-weight:800;font-size:14px;white-space:nowrap}
.big-msg{font-size:24px;font-weight:800;margin:10px 0 4px}

/* settings */
.s-row{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:12px 0;border-top:2px dashed rgba(45,49,66,.25)}
.s-row:first-of-type{border-top:0}
.s-row .l{flex:1;font-weight:800}
.s-row .l small{display:block;color:var(--muted);font-weight:600;font-size:13px}
input[type=range]{width:100%;accent-color:var(--coral-d);min-height:36px}
.sw{position:relative;width:48px;height:28px;flex:none}
.sw input{appearance:none;-webkit-appearance:none;width:48px;height:28px;margin:0;border-radius:999px;background:rgba(45,49,66,.25);border:2px solid var(--slate);cursor:pointer;transition:background .15s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:2px solid var(--slate);transition:transform .15s}
.sw input:checked{background:var(--lcd-hi)}
.sw input:checked::after{transform:translateX(20px)}

/* modal / toast */
.modal{position:fixed;inset:0;background:rgba(45,49,66,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .box{background:var(--paper);border:2px solid var(--slate);border-radius:24px;box-shadow:0 5px 0 var(--lav);padding:20px;max-width:420px;width:100%}
.modal p{font-size:18px;font-weight:800;margin-bottom:16px}
.modal .row{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--slate);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:30;max-width:92vw;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:linear-gradient(180deg,var(--mint-bg1),var(--mint-bg2));transition:opacity .5s ease,visibility .5s;cursor:pointer}
#splash.off{opacity:0;visibility:hidden}
#splash svg{width:min(56vw,250px);height:auto;overflow:visible}
#splash .ring-bg{fill:none;stroke:#fff;stroke-width:13;opacity:.65}
#splash .ring{fill:none;stroke:#2F7F73;stroke-width:13;stroke-linecap:round;stroke-dasharray:440;stroke-dashoffset:110;transform:rotate(-90deg);transform-origin:90px 90px;animation:splring 1.7s cubic-bezier(.3,.1,.2,1) both}
#splash .pi{fill:none;stroke:#1E5A51;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
#splash .dot{fill:var(--coral);animation:spldot .5s 1.5s both}
#splash h2{margin:0;font-weight:800;font-size:clamp(28px,8vw,38px);letter-spacing:.01em;color:#1E5A51;animation:splname .7s .5s both}
#splash .made{margin:-12px 0 0;font-size:13px;font-weight:700;color:#2F7F73;letter-spacing:.02em;animation:splname .7s .9s both}
.made.home{text-align:center;color:var(--muted);font-size:12px;font-weight:700;margin:18px 0 4px;opacity:.8}
@keyframes splring{from{stroke-dashoffset:440}}
@keyframes spldot{from{opacity:0;transform:scale(0)}}
@keyframes splname{from{opacity:0;transform:translateY(8px)}}
.hello{margin:4px 2px 12px;color:var(--ink2);font-size:15px;line-height:1.5}
.hello b{display:block;color:var(--slate);font-size:20px;font-weight:800;margin-bottom:2px}
.tiles{display:grid;gap:12px;margin-bottom:16px}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:20px;border:2px solid var(--slate);background:var(--paper);color:var(--slate);cursor:pointer;font:inherit;box-shadow:0 4px 0 var(--lav);transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(2px);box-shadow:0 2px 0 var(--lav)}
.tile .ic{flex:none;width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--mint-bg2);border:2px solid var(--slate)}
.tile b{display:block;font-size:17px;font-weight:800}
.tile small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.tile.main{background:var(--coral-d);color:#fff;box-shadow:0 4px 0 #7E2A18}
.tile.main .ic{background:#fff;color:var(--coral-d);font-weight:800}
.tile.main small{color:#FFE3DA}
.tpls{display:grid;gap:8px;margin:-4px 0 16px}
.tpl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;border:2px solid var(--slate);background:var(--cream);font:inherit;color:var(--slate);cursor:pointer;text-align:left}
.tpl span{font-size:22px}.tpl b{flex:1;font-size:15px;font-weight:800}.tpl small{color:var(--muted);font-size:13px}
.sec{font-size:13px;font-weight:800;color:var(--lav-d);margin:6px 4px 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.ck-btns{grid-template-columns:1fr}.snd{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body data-view="home">
<div id="splash" role="img" aria-label="The Pi Helper">
  <svg viewBox="0 0 180 180" aria-hidden="true">
    <circle class="ring-bg" cx="90" cy="90" r="70"/>
    <circle class="ring" cx="90" cy="90" r="70"/>
    <g transform="translate(90,92) scale(.62)"><path class="pi" d="M-48 -38 H48 M-20 -38 L-24 42 M22 -38 V24 Q22 44 44 42"/></g>
    <circle class="dot" cx="90" cy="20" r="7" style="transform-origin:90px 20px"/>
  </svg>
  <h2>The Pi Helper</h2>
  <p class="made">Made by CultEQ Tinkerlab</p>
</div>
<div class="app">
  <div class="topleds"><div class="led"><i></i>CULTEQ</div><div class="spk"><i></i><i></i><i></i></div></div>
  <div class="screen">
  <header class="top">
    <button class="icon" id="btn-back" hidden aria-label="Πίσω">‹</button>
    <h1 id="title">The Pi Helper</h1>
    <button class="icon" id="btn-info" aria-label="Πληροφορίες">ⓘ</button>
    <button class="icon" id="btn-settings" aria-label="Ρυθμίσεις">⚙</button>
  </header>
  <div id="support-note" class="note warn" hidden></div>
  <main>
    <section id="view-home" class="view">
      <div id="menu"></div>
      <div id="seq-list"></div>
      <p class="made home">Made by CultEQ Tinkerlab</p>
    </section>

    <section id="view-edit" class="view" hidden></section>

    <section id="view-run" class="view" hidden data-st="running">
      <div class="run-top">
        <button class="icon" id="btn-stop" aria-label="Σταμάτημα ακολουθίας">✕</button>
        <div class="who"><b id="run-seq"></b><span id="run-count"></span></div>
      </div>
      <div class="segs" id="run-segs"></div>
      <div class="ring-wrap">
        <svg viewBox="0 0 220 220" aria-hidden="true"><circle class="ring-bg" cx="110" cy="110" r="100"/><circle class="ring-fg" id="ring" cx="110" cy="110" r="100"/></svg>
        <div class="ring-mid"><div id="run-time" role="timer" aria-live="off">0:00</div><div id="run-state">σε εξέλιξη</div></div>
      </div>
      <h2 id="run-task"></h2>
      <div id="run-type"></div>
      <div id="run-next"></div>

      <div class="checkin" id="checkin" hidden>
        <p id="ck-q"></p>
        <div class="ck-btns">
          <button class="btn" data-ans="done">✓ Τελείωσα</button>
          <button class="btn" data-ans="good">Πάω καλά</button>
          <button class="btn" data-ans="more">Θέλω λίγο ακόμα</button>
          <button class="btn" data-ans="stuck">Κόλλησα</button>

  },
  renderDone(r) {

    $('#view-done').innerHTML = h;
  }
};

function micTest() {
  const out = $('#mic-out');

  if (Rec.disabledReason) { out.textContent = Rec.disabledReason; return; }
  out.textContent = 'Ακούω. Πες π.χ. «πρόσθεσε πέντε λεπτά».';
  micTestCb = (alts, res) => { out.textContent = 'Άκουσα: «' + alts[0] + '»' + (res ? ' → ' + INTENT_L[res.intent] + (res.minutes ? ' (' + res.minutes + '′)' : '') : ' → δεν αντιστοιχεί σε εντολή'); };
  Rec.listenFor(9000, () => { if (micTestCb) { micTestCb = null; out.textContent = 'Δεν άκουσα τίποτα. Έλεγξε το μικρόφωνο.'; } });
}
function exportData() {

function importData(file) {

      askConfirm('Να αντικαταστήσω τα τωρινά δεδομένα με το αντίγραφο;', 'Ναι, αντικατάσταση').then(ok => { if (!ok) return; S = normalizeState(r); save(); UI.toast('Έγινε η επαναφορά.'); renderSettings(); });

  S.sequences.push(q); save(); openEditor(q, true);
  if (!tp) setTimeout(() => { const i = $('#e-name'); if (i) i.focus(); }, 30);
}
$('#menu').addEventListener('click', e => {
  const m = e.target.closest('[data-menu]'), t = e.target.closest('[data-tpl]');
  if (t) { tplOpen = false; newSeqFrom(TEMPLATES[+t.dataset.tpl]); return; }
  if (!m) return;
  if (m.dataset.menu === 'new') newSeqFrom(null); else { tplOpen = !tplOpen; renderHome(); }
});
$('#seq-list').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const q = S.sequences.find(x => x.id === b.closest('.seq').dataset.id); if (!q) return;
  if (b.dataset.act === 'run') startRun(q); else if (b.dataset.act === 'edit') openEditor(q);
});
$('#modal-yes').onclick = () => closeModal(true);
$('#modal-no').onclick = () => closeModal(false);
$('#b-done').onclick = () => applyIntent('done');
$('#b-pause').onclick = () => { const it = curItem(); if (it && it.status === 'paused') resumeRun(); else pauseRun(false); };
(() => {
  const bind = (id, sign) => {
    const b = $('#' + id); let t1 = null, t2 = null, n = 0;
    const step = () => { n++; adjustTime(sign * (n > 12 ? 5 : 1)); };
    const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = null; };
    b.addEventListener('pointerdown', e => { e.preventDefault(); audioCtx(); n = 0; step(); t1 = setTimeout(() => { t2 = setInterval(step, 140); }, 450); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
    b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); adjustTime(sign); } });
  };
  bind('b-less', -1); bind('b-more', 1);
})();
$('#btn-info').onclick = () => UI.show('info');
$('#b-help').onclick = () => UI.show('info');
$('#b-skip').onclick = () => applyIntent('skip');
$('#btn-stop').onclick = () => UI.askStop(false);
$('#b-mic').onclick = () => { audioCtx(); if (!Rec.ok) { UI.toast('Η φωνή δεν υποστηρίζεται εδώ. Χρησιμοποίησε τα κουμπιά.'); return; } S.settings.listen = !S.settings.listen; save(); syncListen(); UI.micState(); UI.toast(S.settings.listen ? 'Ακούω συνεχώς μέχρι να το κλείσεις.' : 'Η ακρόαση έκλεισε.'); };
const ANS = { done: 'done', good: 'good', more: 'more', stuck: 'stuck', pause: 'pause', skip: 'skip', tipok: 'tipok' };
$('#view-run').addEventListener('click', e => { const b = e.target.closest('[data-ans]'); if (b) applyIntent(ANS[b.dataset.ans], 5); });
$('#view-done').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  if (b.dataset.act === 'again') { const s = R.seq; R = null; startRun(s); } else { R = null; UI.show('home'); }
});

/* επεξεργασία: γεγονότα */
const ev = $('#view-edit');
ev.addEventListener('input', e => {
  const q = ED.seq, t = e.target;
  if (t.id === 'e-name') { q.name = t.value; save(); return; }
  const row = t.closest('.task'); if (!row) return;
  const task = q.tasks.find(x => x.id === row.dataset.id);
  if (t.classList.contains('t-name')) { task.name = t.value; if (!task.typeManual) task.type = detectType(task.name); refreshRow(row); save(); }
  else if (t.classList.contains('t-min')) { const v = parseInt(t.value, 10); if (v > 0) { task.minutes = clamp(v, 1, 240); refreshRow(row); save(); } }
});
ev.addEventListener('change', e => {
  const t = e.target, row = t.closest('.task');
  if (t.classList.contains('type-sel') && row) { const task = ED.seq.tasks.find(x => x.id === row.dataset.id); task.type = t.value; task.typeManual = true; refreshRow(row); save(); }
  else if (t.classList.contains('t-min') && row) { const task = ED.seq.tasks.find(x => x.id === row.dataset.id); task.minutes = clamp(parseInt(t.value, 10) || 1, 1, 240); t.value = task.minutes; refreshRow(row); save(); }
  else if (t.dataset.act === 'own' && row) { const task = ED.seq.tasks.find(x => x.id === row.dataset.id); task.alerts = t.checked ? cloneAlerts(ED.seq.alerts) : null; ED.open.add(task.id); save(); renderEdit(); }
});
ev.addEventListener('toggle', e => { const d = e.target; if (d.tagName === 'DETAILS') { const row = d.closest('.task'); if (row) { if (d.open) ED.open.add(row.dataset.id); else ED.open.delete(row.dataset.id); } } }, true);
const custKey = e => { if (e.key === 'Enter' && e.target.matches('.cust input')) { e.preventDefault(); e.target.parentElement.querySelector('button').click(); } };
function custVal(btn) { const n = parseInt(btn.parentElement.querySelector('input').value, 10); if (!(n >= 1 && n <= 240)) { UI.toast('Γράψε λεπτά, από 1 έως 240.'); return 0; } return n; }
function refreshAddLabels() { const n = S.settings.addMin || 5; const t = $('#tipcard [data-ans="more"]'); if (t) t.textContent = '+' + n + ' λεπτά'; }
ev.addEventListener('keydown', custKey);
ev.addEventListener('click', e => {
  const q = ED.seq, ca = e.target.closest('[data-cuadd]');
  if (ca) {
    const n = custVal(ca); if (!n) return; const k = ca.dataset.cuadd;
    if (k === 'brk') q.breakMin = n;
    else { const c = cfgFor(ca.dataset.scope); if (!c) return; if (k === 'checkin') c.checkin = n; else { const key = [10, 5, 2, 1].includes(n) ? 'r' + n : 'c' + n; if (!c.marks.includes(key)) c.marks.push(key); } }
    save(); renderEdit(); return;
  }
  const ae = e.target.closest('[data-ae]');
  if (ae) {
    const k = ae.dataset.ae, v = ae.dataset.v;
    if (k === 'sound') { S.settings.sound = v; save(); audioCtx(); playSound('end', v); renderEdit(); return; }
    const c = cfgFor(ae.dataset.scope); if (!c) return;
    if (k === 'mode') c.mode = v; else if (k === 'checkin') c.checkin = parseInt(v, 10);
    else if (k === 'mark') { const i = c.marks.indexOf(v); if (i >= 0) c.marks.splice(i, 1); else c.marks.push(v); }
    save(); renderEdit(); return;
  }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const row = b.closest('.task'), task = row && q.tasks.find(x => x.id === row.dataset.id), a = b.dataset.act;
  if (a === 'add') { const t = { id: uid(), name: '', minutes: 10, type: 'general', typeManual: false, alerts: null }; q.tasks.push(t); save(); renderEdit(); const i = $$('.t-name').pop(); if (i) { i.focus(); i.scrollIntoView({ block: 'center' }); } }
  else if (a === 'min-' || a === 'min+') { task.minutes = stepMin(task, a === 'min+' ? 1 : -1); $('.t-min', row).value = task.minutes; refreshRow(row); save(); }
  else if (a === 'sug') { task.minutes = parseInt(b.dataset.m, 10); $('.t-min', row).value = task.minutes; refreshRow(row); save(); }
  else if (a === 'up' || a === 'down') { const i = q.tasks.indexOf(task), j = a === 'up' ? i - 1 : i + 1; if (j >= 0 && j < q.tasks.length) { [q.tasks[i], q.tasks[j]] = [q.tasks[j], q.tasks[i]]; save(); renderEdit(); } }
  else if (a === 'del') { q.tasks.splice(q.tasks.indexOf(task), 1); save(); renderEdit(); }
  else if (a === 'brk') { q.breakMin = parseInt(b.dataset.v, 10); save(); renderEdit(); }
  else if (a === 'start') { q.tasks = q.tasks.filter(t => t.name.trim()); if (!q.name.trim()) q.name = 'Νέα ακολουθία'; save(); if (!q.tasks.length) { UI.toast('Πρόσθεσε πρώτα μία εργασία.'); renderEdit(); return; } ED = null; startRun(q); }
  else if (a === 'dup') { cleanupSeq(); const c = JSON.parse(JSON.stringify(q)); c.id = uid(); c.name = (q.name || 'Ακολουθία') + ' (αντίγραφο)'; c.tasks.forEach(t => { t.id = uid(); }); S.sequences.push(c); save(); ED = null; UI.show('home'); UI.toast('Έγινε αντίγραφο.'); }
  else if (a === 'delseq') askConfirm('Να διαγράψω αυτή την ακολουθία;', 'Ναι, διαγραφή').then(ok => { if (!ok) return; S.sequences = S.sequences.filter(x => x !== q); save(); ED = null; UI.show('home'); });
});

/* ρυθμίσεις: γεγονότα */
const sv = $('#view-settings');
sv.addEventListener('input', e => { const t = e.target, k = t.dataset.set; if (!k) return; if (t.type === 'range') { S.settings[k] = parseFloat(t.value); save(); } });
sv.addEventListener('change', e => {
  const t = e.target, k = t.dataset.set;
  if (t.id === 'imp') { if (t.files[0]) importData(t.files[0]); t.value = ''; return; }
  if (!k) return;
  if (k === 'lang') { setLang(t.value); renderSettings(); return; }
  if (t.type === 'checkbox') {
    S.settings[k] = t.checked; save();
    if (k === 'notify' && t.checked && 'Notification' in window) { try { Notification.requestPermission(); } catch (x) { } }
    if (k === 'listen') { audioCtx(); if (t.checked && Rec.ok) UI.toast('Η ακρόαση ξεκινά όταν τρέξεις μια ακολουθία.'); }
  } else if (t.tagName === 'SELECT') { S.settings[k] = t.value; save(); }
});
sv.addEventListener('keydown', custKey);
sv.addEventListener('click', e => {
  const ca = e.target.closest('[data-cuadd]'); if (ca) { const n = custVal(ca); if (n) { S.settings.addMin = n; save(); refreshAddLabels(); renderSettings(); } return; }
  const am = e.target.closest('[data-ae="addmin"]'); if (am) { S.settings.addMin = parseInt(am.dataset.v, 10); save(); refreshAddLabels(); renderSettings(); return; }
  const s = e.target.closest('[data-set][data-v]'); if (s) { S.settings[s.dataset.set] = s.dataset.v; save(); renderSettings(); return; }
  const ae = e.target.closest('[data-ae="sound"]'); if (ae) { S.settings.sound = ae.dataset.v; save(); audioCtx(); playSound('end', ae.dataset.v); renderSettings(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'test-voice') { audioCtx(); speak('Γεια σου! Είμαι εδώ, δίπλα σου.', { cancel: true }); }
  else if (a === 'test-mic') micTest();
  else if (a === 'export') exportData();
  else if (a === 'reset-history') askConfirm('Να διαγράψω το ιστορικό διάρκειας;', 'Ναι, διαγραφή').then(ok => { if (ok) { S.history = []; save(); renderSettings(); } });
});

/* συντομεύσεις πληκτρολογίου στην εκτέλεση */
document.addEventListener('keydown', e => {
  if (view !== 'run' || !R || R.finished || e.target.closest('input,select,textarea') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (!$('#modal').hidden) return;
  const it = curItem();
  if (e.code === 'Space') { e.preventDefault(); if (it.status === 'paused') resumeRun(); else pauseRun(false); }
  else if (e.code === 'KeyD') applyIntent('done');
  else if (e.code === 'KeyM') addTime(S.settings.addMin || 5);
  else if (e.code === 'KeyR') sayRemaining();
  else if (e.code === 'Escape') UI.askStop(false);
});
window.addEventListener('beforeunload', e => { if (R && !R.finished) { e.preventDefault(); e.returnValue = ''; } });

/* ============ εκκίνηση ============ */
window.__dp = { speak: (...a) => speak(...a), NATIVE, toEn, enMode, setLang, classify, detectType, get S() { return S; }, get R() { return R; }, EV, classify, classifyAlts, detectType, predict, parseMinutes, norm, tick, itemRemaining, setNow(fn) { nowFn = fn || (() => Date.now()); }, startRun, applyIntent, handleHeard, Rec, UI, finishCurrent, TYPES };
(function(){ const sp = document.getElementById('splash'); if (!sp) return; if (navigator.webdriver) { sp.remove(); return; } const hide = () => { sp.classList.add('off'); setTimeout(() => sp.remove(), 700); }; sp.addEventListener('click', hide); setTimeout(hide, 2600); })();
refreshAddLabels(); UI.show('home'); trStart(); UI.micState(); UI.refreshNote();
})();
</script>
</body>
