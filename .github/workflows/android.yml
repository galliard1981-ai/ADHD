name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Εγκατάσταση πακέτων
        run: npm install
      - name: Δημιουργία έργου Android
        run: npx cap add android
      - name: Δικαιώματα και αναζήτηση φωνής
        run: python3 scripts/patch_manifest.py
      - name: Εικονίδιο
        run: |
          pip install pillow --break-system-packages || pip install pillow
          python3 scripts/apply_icons.py
      - name: Συγχρονισμός
        run: npx cap sync android
      - name: Build (debug APK)
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dipla-sou-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
